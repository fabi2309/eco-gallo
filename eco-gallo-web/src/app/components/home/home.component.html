<div class="home-container">
  <header class="home-header">
    <h2>ECO-GALLO — Publicaciones</h2>
    <div class="actions">
      <button routerLink="/create-post">Publicar algo</button>
      <button routerLink="/my-posts">Mis publicaciones</button>
      <button routerLink="/profile">Mi perfil</button>
    </div>
  </header>

  <!-- Buscador y Filtros -->
  <div class="filter-container">
    <input 
      type="text" 
      [(ngModel)]="searchTerm" 
      placeholder="Buscar productos ecológicos..." 
      (input)="filterPosts()" 
    />
    
    <select [(ngModel)]="selectedCategory" (change)="filterPosts()">
      <option value="">Todas las categorías</option>
      <option value="Libros">Libros</option>
      <option value="Apuntes">Apuntes y material de estudio</option>
      <option value="Laboratorio">Material de laboratorio</option>
      <option value="Tecnología">Tecnología</option>
      <option value="Arquitectura">Arquitectura</option>
      <option value="Uniformes">Uniformes y ropa académica</option>
      <option value="Deportes">Deportes</option>
      <option value="Electrónica">Electrónica</option>
      <option value="Otros">Otros</option>
    </select>
  </div>

  <div class="posts-container" *ngIf="filteredPosts && filteredPosts.length > 0; else noPosts">
    <div class="post-card" *ngFor="let post of filteredPosts">
      
      <!-- Imagen con la corrección de object-fit y la ruta local -->
      <img *ngIf="post.image" [src]="'http://localhost:5000' + post.image" alt="Imagen del producto" style="width: 100%; height: 180px; object-fit: contain; background-color: #f8f9fa; border-radius: 8px; margin-bottom: 10px;" />
      
      <h3>{{ post.title }}</h3>
      <p>{{ post.description }}</p>
      <p class="price">${{ post.price }}</p>
      <span class="badge-yellow">{{ post.category }}</span>
      <span class="badge-yellow" style="margin-left: 5px;">{{ post.physicalState }}</span>
      
      <!-- IMPORTANTE: Botón para navegar al detalle conectado dinámicamente al ID -->
      <button class="btn-ver-detalle" [routerLink]="['/post', post.id]" style="display: block; margin-top: 15px; width: 100%; padding: 10px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; text-align: center;">Ver detalle</button>
    
    </div>
  </div>

  <ng-template #noPosts>
    <div class="post-card" style="text-align: center;">
      <p>No se encontraron publicaciones con esos criterios.</p>
    </div>
  </ng-template>
</div>
