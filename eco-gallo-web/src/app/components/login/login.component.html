<div class="auth-container">
  <h2>Iniciar Sesión - ECO-GALLO</h2>
  <form (ngSubmit)="onLogin()">
    <div class="form-group">
      <label>Correo electrónico:</label>
      <input type="email" [(ngModel)]="credentials.email" name="email" placeholder="correo@uaa.edu.mx" required />
    </div>

    <div class="form-group">
      <label>Contraseña:</label>
      <input type="password" [(ngModel)]="credentials.password" name="password" placeholder="******" required />
    </div>

    <button type="submit" class="btn-submit">Entrar</button>
  </form>
  
  <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
  <p class="switch-auth">¿No tienes cuenta? <a routerLink="/register">Regístrate aquí</a></p>
</div>
