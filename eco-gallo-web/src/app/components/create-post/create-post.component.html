<div class="create-post-container">
  <h2>Crear Publicación - ECO-GALLO</h2>
  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>Título:</label>
      <input type="text" [(ngModel)]="postData.title" name="title" required />
    </div>

    <div class="form-group">
      <label>Descripción:</label>
      <textarea [(ngModel)]="postData.description" name="description" required></textarea>
    </div>

    <div class="form-group">
      <label>Categoría:</label>
      <select [(ngModel)]="postData.category" name="category" required>
        <option value="Libros">Libros</option>
        <option value="Apuntes">Apuntes y material de estudio</option>
        <option value="Laboratorio">Material de laboratorio</option>
        <option value="Tecnología">Tecnología</option>
        <option value="Arquitectura">Arquitectura</option>
        <option value="Uniformes">Uniformes y ropa académica</option>
        <option value="Deportes">Deportes</option>
        <option value="Electrónica">Electrónica</option>
        <option value="Otros">Otros</option>
      </select>
    </div>

    <div class="form-group">
      <label>Estado físico:</label>
      <select [(ngModel)]="postData.physicalState" name="physicalState" required>
        <option value="Nuevo">Nuevo</option>
        <option value="Como nuevo">Como nuevo</option>
        <option value="Usado">Usado</option>
      </select>
    </div>

    <div class="form-group">
      <label>Precio ($):</label>
      <input type="number" [(ngModel)]="postData.price" name="price" />
    </div>

    <div class="form-group">
      <label>Imagen del material:</label>
      <input type="file" (change)="onFileSelected($event)" />
    </div>

    <button type="submit" class="btn-submit">Publicar</button>
  </form>
  <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
</div>
