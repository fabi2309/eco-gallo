<div class="my-posts-container">
  <!-- Cabecera de la sección -->
  <div class="header-section">
    <h2>Mis Publicaciones</h2>
    <button routerLink="/home" class="btn-back">Volver al inicio</button>
  </div>

  <!-- Cuadrícula de publicaciones -->
  <div class="posts-grid" *ngIf="myPosts && myPosts.length > 0; else noPosts">
    <div *ngFor="let post of myPosts" class="post-card">
      
      <!-- Imagen del producto (igual que en el home) -->
      <img *ngIf="post.image" [src]="'http://localhost:5000' + post.image" alt="Imagen del producto" class="post-img" />

      <div class="post-info">
        <h3>{{ post.title }}</h3>
        <p class="description">{{ post.description }}</p>
        <p class="price">${{ post.price }}</p>
        
        <div class="badges-container">
          <span class="badge-yellow">{{ post.category }}</span>
          <span class="badge-yellow" *ngIf="post.physicalState">{{ post.physicalState }}</span>
        </div>
      </div>

      <!-- Botones de acción organizados -->
      <div class="card-actions">
        <button [routerLink]="['/post', post.id]" class="btn-detail">Ver detalle</button>
        <button (click)="editPost(post)" class="btn-edit">Editar</button>
        <button (click)="deletePost(post.id)" class="btn-delete">Eliminar</button>
      </div>

    </div>
  </div>

  <ng-template #noPosts>
    <div class="empty-state">
      <p>Aún no has realizado ninguna publicación.</p>
    </div>
  </ng-template>

  <!-- Formulario / Modal de Edición -->
  <div class="edit-modal" *ngIf="selectedPost">
    <div class="modal-content">
      <h3>Editar Publicación</h3>
      <form (ngSubmit)="savePost()">
        <div class="form-group">
          <label>Título:</label>
          <input type="text" [(ngModel)]="selectedPost.title" name="title" required />
        </div>

        <div class="form-group">
          <label>Descripción:</label>
          <textarea [(ngModel)]="selectedPost.description" name="description" required></textarea>
        </div>

        <div class="form-group">
          <label>Categoría:</label>
          <input type="text" [(ngModel)]="selectedPost.category" name="category" required />
        </div>

        <div class="form-group">
          <label>Estado Físico:</label>
          <select [(ngModel)]="selectedPost.physicalState" name="physicalState" required>
            <option value="Nuevo">Nuevo</option>
            <option value="Como nuevo">Como nuevo</option>
            <option value="Usado">Usado</option>
          </select>
        </div>

        <div class="form-group">
          <label>Precio:</label>
          <input type="number" [(ngModel)]="selectedPost.price" name="price" required />
        </div>

        <div class="form-group">
          <label>Cambiar Imagen (Opcional):</label>
          <input type="file" (change)="onFileSelected($event)" accept="image/*" />
        </div>

        <div class="modal-actions">
          <button type="submit" class="btn-save">Guardar Cambios</button>
          <button type="button" (click)="cancelEdit()" class="btn-cancel">Cancelar</button>
        </div>
      </form>
    </div>
  </div>
</div>
