name: CI/CD Pipeline - ECO-GALLO UAA

on:
  push:
    branches: [ "main", "rama-rey1", "master" ]
  pull_request:
    branches: [ "main", "rama-rey1", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    name: Integración Continua, Pruebas y Empaquetado
    runs-on: ubuntu-latest

    steps:
      # ======================================================================
      # 1. Descarga de código fuente desde los pasos del YAML
      # ======================================================================
      - name: 1. Descargar código fuente del repositorio
        uses: actions/checkout@v4

      # ======================================================================
      # 2. Configuración del entorno y dependencias desde los pasos de YAML
      # ======================================================================
      - name: 2.1 Configurar entorno Python (3.11)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 2.2 Configurar entorno Java JDK (21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 2.3 Instalar dependencias de producción y desarrollo
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r requirements-dev.txt

      # ======================================================================
      # Compilación del proyecto
      # ======================================================================
      - name: Compilación del Gateway oficial (Java)
        run: |
          javac -d gateway/out gateway/Gateway.java
          echo "Compilación de Gateway completada con éxito."

      # ======================================================================
      # 3. Configuración de Análisis estáticos de código (Linting)
      # ======================================================================
      - name: 3. Análisis estático de código (Flake8 Linting)
        run: |
          flake8 backend tests --config=.flake8 --count --statistics

      # ======================================================================
      # 4. Configuración de Análisis de Vulnerabilidades
      # ======================================================================
      - name: 4.1 Análisis de vulnerabilidades en código con Bandit
        run: |
          bandit -r backend -ll -ii

      - name: 4.2 Análisis de vulnerabilidades en dependencias con pip-audit
        run: |
          pip-audit -r backend/requirements.txt

      # ======================================================================
      # 5. Configuración para ejecución de pruebas unitarias 
      # ======================================================================
      - name: 5. Ejecución de pruebas unitarias automatizadas (Pytest)
        run: |
          pytest tests/test_unit.py -v

      # ======================================================================
      # 6. Configuración para ejecución de pruebas de integración
      # ======================================================================
      - name: 6. Ejecución de pruebas de integración E2E
        env:
          ECOGALLO_DEV: "1"
          ECOGALLO_ADMINS: "admin@edu.uaa.mx"
          PORT: "8080"
          PYTHONIOENCODING: "utf-8"
        run: |
          python run_dev.py &
          sleep 4
          python tests/e2e_api.py http://localhost:8080

      # ======================================================================
      # 7. Configuración para realizar el empaquetado del proyecto (Docker) 
      # ======================================================================
      - name: 7.1 Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 7.2 Iniciar sesión en GitHub Packages (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 7.3 Construir y empaquetar contenedor Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
