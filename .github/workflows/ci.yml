name: CI/CD Pipeline - ECO-GALLO UAA

on:
  push:
    branches: [ "main", "rama-rey1", "master" ]
  pull_request:
    branches: [ "main", "rama-rey1", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    name: Integración Continua, Pruebas y Empaquetado
    runs-on: ubuntu-24.04   # fijo: evita el salto automático de ubuntu-latest a Ubuntu 26

    steps:
      - name: 1. Descargar código fuente del repositorio
        uses: actions/checkout@v5

      - name: 2.1 Configurar entorno Python (3.11)
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt

      - name: 2.2 Configurar entorno Java JDK (21)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 2.3 Instalar dependencias de producción y desarrollo
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r requirements-dev.txt

      - name: Compilación del Gateway oficial (Java)
        run: |
          mkdir -p gateway/out
          javac -d gateway/out gateway/Gateway.java
          echo "Compilación de Gateway completada con éxito."

      - name: 3. Análisis estático de código (Flake8 Linting)
        run: flake8 backend tests --config=.flake8 --count --statistics

      - name: 4.1 Análisis de vulnerabilidades en código con Bandit
        run: bandit -r backend -ll -ii

      - name: 4.2 Análisis de vulnerabilidades en dependencias con pip-audit
        run: pip-audit -r backend/requirements.txt

      - name: 5. Ejecución de pruebas unitarias automatizadas (Pytest)
        run: pytest tests/test_unit.py -v

      - name: 6. Ejecución de pruebas de integración E2E
        env:
          ECOGALLO_DEV: "1"
          ECOGALLO_ADMINS: "admin@edu.uaa.mx"
          PORT: "8080"
          PYTHONIOENCODING: "utf-8"
        run: |
          python run_dev.py &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/ >/dev/null && break
            sleep 1
          done
          python tests/e2e_api.py http://localhost:8080

      - name: 7.1 Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 7.2 Iniciar sesión en GitHub Packages (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 7.3 Construir y empaquetar contenedor Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/eco-gallo:latest
            ghcr.io/${{ github.repository_owner }}/eco-gallo:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max